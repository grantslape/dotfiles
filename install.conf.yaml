- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.zshrc: zshrc
    ~/.oh-my-zsh: oh-my-zsh/
    ~/.vim: vim/
    ~/.vimrc: vimrc
    ~/.gitconfig: gitconfig
    ~/.zsh-custom: zsh/
    ~/.scripts.sh: scripts.sh
    ~/.p10k.zsh: p10k.zsh
    ~/.ssh/config:
      path: ssh/config
      force: true
    ~/.config/karabiner/karabiner.json:
      path: config/karabiner/karabiner.json
      force: true
    ~/.config/opencode/opencode.jsonc:
      path: config/opencode/opencode.jsonc
      force: true
    ~/.oh-my-zsh/custom/plugins/zsh-completions:
      path: zsh/plugins/zsh-completions
      force: true
    ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting:
      path: zsh/plugins/zsh-syntax-highlighting
      force: true

- shell:
    - command: 'test -d "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions/.git" || git clone https://github.com/zsh-users/zsh-autosuggestions "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"'
      description: Installing zsh-autosuggestions
    - command: 'test -d "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k/.git" || git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k"'
      description: Installing Powerlevel10k
    - command: ./scripts/create-ssh-key
      description: Creating workstation SSH key
      stdin: true
    - command: brew bundle --file=Brewfile
      description: Installing Brew packages
    - command: gpg --batch --import me@grantslape.com.pub.asc
      description: Importing YubiKey GPG public key
    - command: >-
        command -v rustup >/dev/null 2>&1 ||
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      description: Installing Rust
