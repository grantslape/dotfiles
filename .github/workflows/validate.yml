name: Validate dotfiles

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate installer scripts
        run: bash -n install scripts/create-ssh-key

      - name: Validate Zsh configuration
        run: zsh -n zshrc scripts.sh p10k.zsh

      - name: Validate Dotbot configuration in an isolated home
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" ./dotbot/bin/dotbot \
            -d "$GITHUB_WORKSPACE" \
            -c install.conf.yaml \
            --only link \
            --no-color
